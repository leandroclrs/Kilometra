<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KILOMETRA</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header class="topbar">

        <div class="logo">
            LOGO DO KILOMETRA
        </div>

        <nav class="menu">

            <a href="#" class="menu-item active">Início</a>
            <a href="#" class="menu-item">Veículos</a>
            <a href="#" class="menu-item">Abastecimentos</a>
            <a href="#" class="menu-item">Gastos</a>
            <a href="#" class="menu-item">Manutenções</a>
            <a href="#" class="menu-item">Relatórios</a>
            <a href="#" class="menu-item">Postos</a>

        </nav>

        <div class="usuario">
            Usuário XXX
        </div>

    </header>

    <main class="content">

        <h1>Visão geral</h1>

        <section class="cards">

            <div class="card">

                <p class="card-title">Veículo</p>

                <p class="card-value">
                    XXXXXXXXX
                </p>

            </div>

            <div class="card">

                <p class="card-title">Consumo médio</p>

                <p class="card-value">
                    12,5 km/L
                </p>

            </div>

            <div class="card">

                <p class="card-title">Gastos</p>

                <p class="card-value">
                    R$ 850,00
                </p>

            </div>

            <div class="card">

                <p class="card-title">Autonomia</p>

                <p class="card-value">
                    200 km
                </p>

            </div>

        </section>

        <section class="dashboard">

            <div class="panel">

                <h2>Próximas Manutenções</h2>

                <p>
                    Conteúdo das manutenções
                </p>

            </div>

            <div class="panel">

                <h2>Últimos Abastecimentos</h2>

                <p>
                    Registros dos abastecimentos
                </p>

            </div>

        </section>

    </main>

</body>

</html>
